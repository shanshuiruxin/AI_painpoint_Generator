<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d18">
  <title>痛点与解决方案生成器</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d18;
      --panel: rgba(17, 24, 42, 0.82);
      --line: rgba(144, 164, 220, 0.16);
      --text: #edf2ff;
      --muted: #8995b2;
      --accent: #83f3d0;
      --blue: #8ca7ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      display: grid;
      place-items: center;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 0%, rgba(52, 77, 142, 0.2), transparent 50%),
        var(--bg);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(100%, 720px);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 52px);
      line-height: 1.15;
      letter-spacing: -0.045em;
    }

    .intro {
      margin: 16px 0 32px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .input-panel,
    .result-panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(14px);
    }

    .input-panel {
      padding: 22px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #cbd4ed;
      font-size: 13px;
      font-weight: 600;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 14px 15px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      color: var(--text);
      background: rgba(5, 9, 18, 0.68);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    input::placeholder {
      color: #66718c;
    }

    input:focus {
      border-color: rgba(131, 243, 208, 0.65);
      box-shadow: 0 0 0 3px rgba(131, 243, 208, 0.1);
    }

    button {
      flex: 0 0 auto;
      padding: 0 20px;
      border: 0;
      border-radius: 10px;
      color: #071511;
      background: var(--accent);
      font-weight: 750;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease;
    }

    button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:focus-visible {
      outline: 3px solid rgba(131, 243, 208, 0.45);
      outline-offset: 3px;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .hint {
      margin: 11px 0 0;
      color: #74809c;
      font-size: 12px;
      line-height: 1.6;
    }

    .hint[data-state="error"] {
      color: #ff9a9a;
    }

    .field {
      margin-bottom: 20px;
    }

    .result-panel {
      margin-top: 20px;
      padding: 24px;
      animation: reveal 300ms ease both;
    }

    .result-panel[hidden] {
      display: none;
    }

    .result-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .result-heading h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
    }

    .tag {
      padding: 6px 9px;
      border: 1px solid rgba(140, 167, 255, 0.23);
      border-radius: 999px;
      color: var(--blue);
      background: rgba(140, 167, 255, 0.08);
      font-size: 11px;
      white-space: nowrap;
    }

    .pain-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: pain;
    }

    .pain-list li {
      position: relative;
      padding: 13px 14px 13px 44px;
      border: 1px solid rgba(144, 164, 220, 0.1);
      border-radius: 10px;
      color: #c8d1e8;
      background: rgba(255, 255, 255, 0.025);
      font-size: 14px;
      line-height: 1.6;
      counter-increment: pain;
    }

    .pain-list li::before {
      position: absolute;
      top: 13px;
      left: 14px;
      color: var(--accent);
      content: "0" counter(pain);
      font-size: 11px;
      font-weight: 700;
    }

    .solution {
      margin-top: 18px;
      padding: 17px;
      border: 1px solid rgba(131, 243, 208, 0.2);
      border-radius: 12px;
      background: linear-gradient(
        135deg,
        rgba(131, 243, 208, 0.08),
        rgba(131, 243, 208, 0.025)
      );
    }

    .solution-label {
      margin-bottom: 8px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.12em;
    }

    .solution p {
      margin: 0;
      color: #e1f3ef;
      font-size: 14px;
      line-height: 1.7;
    }

    .stream-output {
      margin: 0;
      color: #c8d1e8;
      font: inherit;
      line-height: 1.7;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 32px 16px;
      }

      .input-panel,
      .result-panel {
        padding: 18px;
      }

      .input-row {
        flex-direction: column;
      }

      button {
        min-height: 48px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="eyebrow">
      <span class="status-dot" aria-hidden="true"></span>
      AI INSIGHT GENERATOR
    </div>

    <h1>发现痛点，<br>生成解法。</h1>
    <p class="intro">
      输入一个特定人群，快速探索他们可能遇到的真实困扰，<br>
      并获得一个轻量、可执行的 AI 解决方案。
    </p>

    <form class="input-panel" id="generator-form">
      <div class="field">
        <label for="api-key">DeepSeek API Key</label>
        <input
          id="api-key"
          name="api-key"
          type="password"
          placeholder="粘贴你的 DeepSeek API Key"
          autocomplete="off"
          spellcheck="false"
          required
        >
        <p class="hint">
          密钥仅用于本机服务器转发，不会保存。请勿在公共设备使用。
          免费额度和资费以 DeepSeek 账号页面为准。
        </p>
      </div>

      <label for="audience">你想了解哪类人群？</label>
      <div class="input-row">
        <input
          id="audience"
          name="audience"
          type="text"
          placeholder="例如：高中生、外卖员、小企业主"
          maxlength="40"
          autocomplete="off"
          required
        >
        <button id="generate-button" type="submit">
          生成方案 <span aria-hidden="true">↗</span>
        </button>
      </div>
      <p class="hint">输入人群名称，AI 将为你组合一组灵感。</p>
      <p class="hint" id="request-status" role="status" aria-live="polite" hidden></p>
    </form>

    <section class="result-panel" id="result" aria-live="polite" hidden>
      <div class="result-heading">
        <h2 id="result-title">人群洞察</h2>
        <span class="tag">AI 生成</span>
      </div>
      <pre class="stream-output" id="stream-output" aria-live="polite"></pre>
      <ol class="pain-list" id="pain-list"></ol>
      <div class="solution" id="solution-panel">
        <div class="solution-label">✦ 极简 AI 解决方案</div>
        <p id="solution-text"></p>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("generator-form");
    const apiKeyInput = document.getElementById("api-key");
    const audienceInput = document.getElementById("audience");
    const generateButton = document.getElementById("generate-button");
    const result = document.getElementById("result");
    const resultTitle = document.getElementById("result-title");
    const streamOutput = document.getElementById("stream-output");
    const painList = document.getElementById("pain-list");
    const solutionPanel = document.getElementById("solution-panel");
    const solutionText = document.getElementById("solution-text");
    const requestStatus = document.getElementById("request-status");
    const originalButtonHtml = generateButton.innerHTML;

    function showStatus(message, isError = false) {
      requestStatus.textContent = message;
      requestStatus.dataset.state = isError ? "error" : "info";
      requestStatus.setAttribute("role", isError ? "alert" : "status");
      requestStatus.hidden = !message;
    }

    function parseGeneratedContent(content) {
      const generated = JSON.parse(content);
      if (
        !generated ||
        !Array.isArray(generated.pains) ||
        generated.pains.length !== 3 ||
        !generated.pains.every((pain) => typeof pain === "string" && pain.trim()) ||
        typeof generated.solution !== "string" ||
        !generated.solution.trim()
      ) {
        throw new Error("模型返回内容格式不完整，请重试。");
      }
      return generated;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const audience = audienceInput.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!apiKey || !audience) {
        (apiKey ? audienceInput : apiKeyInput).focus();
        return;
      }

      generateButton.disabled = true;
      generateButton.textContent = "生成中…";
      result.hidden = false;
      resultTitle.textContent = `${audience} · 人群洞察`;
      streamOutput.textContent = "";
      streamOutput.hidden = false;
      painList.replaceChildren();
      painList.hidden = true;
      solutionText.textContent = "";
      solutionPanel.hidden = true;
      showStatus("正在连接 DeepSeek，内容将实时显示…");

      try {
        const response = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ apiKey, audience })
        });

        if (!response.ok) {
          let message = `请求失败（HTTP ${response.status}）`;
          try {
            const data = await response.json();
            message = data.error || message;
          } catch {
            // HTTP 状态码可用于展示非 JSON 错误响应。
          }
          throw new Error(message);
        }

        if (!response.body) {
          throw new Error("浏览器不支持读取流式响应。");
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";
        let currentEvent = "message";
        let currentData = [];
        let content = "";
        let streamFinished = false;

        function dispatchStreamEvent() {
          if (currentData.length === 0) {
            currentEvent = "message";
            return;
          }

          const eventData = currentData.join("\n");
          currentData = [];

          if (currentEvent === "error") {
            const errorData = JSON.parse(eventData);
            throw new Error(errorData.error || "流式请求失败。");
          }

          if (currentEvent === "done") {
            streamFinished = true;
          } else if (currentEvent === "message") {
            const chunk = JSON.parse(eventData);
            if (typeof chunk !== "string") {
              throw new Error("服务器返回了无效的数据块。");
            }
            content += chunk;
            streamOutput.textContent += chunk;
          }

          currentEvent = "message";
        }

        function processStreamLine(line) {
          if (line === "") {
            dispatchStreamEvent();
          } else if (line.startsWith("event:")) {
            currentEvent = line.slice(6).trim();
          } else if (line.startsWith("data:")) {
            currentData.push(line.slice(5).trimStart());
          }
        }

        while (true) {
          const { value, done } = await reader.read();
          if (done) {
            break;
          }

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split(/\r?\n/);
          buffer = lines.pop();
          lines.forEach(processStreamLine);
        }

        buffer += decoder.decode();
        if (buffer) {
          processStreamLine(buffer);
        }
        dispatchStreamEvent();

        if (!streamFinished) {
          throw new Error("流式响应意外结束，请重试。");
        }

        const generated = parseGeneratedContent(content);
        streamOutput.hidden = true;
        painList.hidden = false;
        solutionPanel.hidden = false;

        generated.pains.forEach((pain) => {
          const item = document.createElement("li");
          item.textContent = pain.trim();
          painList.appendChild(item);
        });

        solutionText.textContent = generated.solution.trim();
        showStatus("");
      } catch (error) {
        showStatus(
          `生成失败：${error instanceof Error ? error.message : "发生未知错误。"} 请检查 API Key、网络连接和 DeepSeek API 状态。`,
          true
        );
      } finally {
        generateButton.disabled = false;
        generateButton.innerHTML = originalButtonHtml;
      }
    });
  </script>
</body>
</html>
